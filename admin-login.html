<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Securo - Admin Login</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --success: #22c55e;
            --border: rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; }

        /* (2026-07-13) Remove body padding & make mobile responsive; was padding 20px */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            font-family: "Outfit", sans-serif;
            color: var(--text);
        }

        /* (2026-07-13) Disable dragging for all images; was default draggable */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            margin: auto;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }
            .login-container {
                padding: 32px 20px;
                border-radius: 24px;
            }
            h1 {
                font-size: 1.45rem;
            }
            .subtitle {
                font-size: 0.88rem;
            }
            .header {
                margin-bottom: 24px;
            }
            .form-group {
                margin-bottom: 16px;
            }
            input {
                padding: 12px 14px 12px 42px;
                font-size: 0.95rem;
                border-radius: 14px;
            }
            .login-btn {
                padding: 14px;
                font-size: 0.95rem;
                border-radius: 14px;
                margin-top: 22px;
            }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-wrap {
            width: 64px;
            height: 64px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .logo-wrap span { font-size: 32px; }

        h1 {
            font-family: "Sora", sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper span {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 20px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 16px 14px 48px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .login-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 32px;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 24px;
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text);
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header">
            <div class="logo-wrap">
                <span class="material-symbols-outlined">admin_panel_settings</span>
            </div>
            <h1>Command Center</h1>
            <p class="subtitle">Official Admin Authentication</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminEmail">Administrator Email</label>
                <div class="input-wrapper">
                    <span class="material-symbols-outlined">mail</span>
                    <input type="email" id="adminEmail" placeholder="admin@securo.app" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Security Password</label>
                <div class="input-wrapper">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="login-btn">
                <span id="submitBtnText">Access Command Center</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <!-- (2026-07-13) Remove public admin registration; was toggle register account -->
        <a href="index.html" class="back-link">Return to Student Application</a>
    </div>

    <script type="module">
        import { login } from './auth.js';
        import { auth } from './firebase-config.js';
        import { getUserProfile } from './db.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const ADMIN_EMAIL = 'admin@admin.com';
        const ADMIN_PASSWORD = 'admin123';
        const loginForm = document.getElementById('adminLoginForm');
        const adminEmailInput = document.getElementById('adminEmail');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const errorMessage = document.getElementById('errorMessage');

        adminEmailInput.value = ADMIN_EMAIL;

        const showError = (msg) => {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        };

        // Redirect if already logged in as admin
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const profile = await getUserProfile(user.uid);
                if (user.email === ADMIN_EMAIL || profile?.role === 'admin') {
                    window.location.href = 'admin.html';
                }
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = adminEmailInput.value.trim();
            const pass = passwordInput.value;

            submitBtn.disabled = true;
            spinner.style.display = 'block';

            try {
                if (email !== ADMIN_EMAIL || pass !== ADMIN_PASSWORD) {
                    throw new Error(`Use the static admin credentials: ${ADMIN_EMAIL} / ${ADMIN_PASSWORD}`);
                }

                const user = await login(email, pass);
                const profile = await getUserProfile(user.uid);

                if (user.email !== ADMIN_EMAIL && profile?.role !== 'admin') {
                    await signOut(auth);
                    showError("Access restricted. This account does not have administrator privileges.");
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    return;
                }
                
                // Redirect will be handled by onAuthStateChanged
            } catch (error) {
                console.error("Auth error:", error);
                let msg = error.message;
                if (error.code === 'auth/invalid-credential') msg = "Incorrect password or account not found.";
                if (error.code === 'auth/email-already-in-use') msg = "This static admin email is already registered. Please sign in instead.";
                showError(msg || "Authentication failed.");
                submitBtn.disabled = false;
                spinner.style.display = 'none';
            }
        });

        // (2026-07-13) Prevent image drag across entire application; was draggable
        window.addEventListener('dragstart', (e) => {
            if (e.target && e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        }, false);
    </script>
</body>
</html>
