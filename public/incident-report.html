<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Securo - Incident Report</title>
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0">
    
    <!-- (2026-07-13) Link consolidated public styles; was inline style tag -->
    <link rel="stylesheet" href="public.css">
</head>
<body class="page-incident" data-page="incident">
    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <div class="page-shell">
        <div class="glass-shell">
            <header class="topbar">
                <div class="brand-wrap">
                    <div class="brand-badge">
                        <span class="material-symbols-outlined">description</span>
                    </div>
                    <div>
                        <h1>Incident Report</h1>
                        <p>Detailed emergency capture record.</p>
                    </div>
                </div>
                <div class="topbar-actions">
                    <!-- (2026-07-13) Add print and export buttons; was back link only -->
                    <button id="btnPrintOfficialReport" class="ghost-btn pub-incident-u1" type="button">
                        <span class="material-symbols-outlined pub-incident-u2">print</span>
                        <span>Print Dossier</span>
                    </button>
                    <button id="btnExportOfficialJson" class="ghost-btn pub-incident-u1" type="button">
                        <span class="material-symbols-outlined pub-incident-u2">data_object</span>
                        <span>Export JSON</span>
                    </button>
                    <a href="../admin/admin.html" class="ghost-btn">
                        <span class="material-symbols-outlined">arrow_back</span>
                        <span>Back to Admin</span>
                    </a>
                </div>
            </header>

            <main class="content">
                <section class="panel-card">
                    <div class="eyebrow">Emergency Record</div>
                    <h2 class="hero-title" id="incidentTitle">Loading report...</h2>
                    <p class="hero-copy" id="incidentCopy">Fetching incident details and attachments.</p>
                </section>

                <section class="panel-card">
                    <div class="info-grid">
                        <div class="info-card">
                            <strong>Report ID</strong>
                            <span id="incidentId">--</span>
                        </div>
                        <div class="info-card">
                            <strong>User</strong>
                            <span id="incidentUser">--</span>
                        </div>
                        <div class="info-card">
                            <strong>Time</strong>
                            <span id="incidentTime">--</span>
                        </div>
                        <div class="info-card">
                            <strong>Status</strong>
                            <span id="incidentStatus">--</span>
                        </div>
                    </div>
                </section>

                <section class="panel-card">
                    <div class="info-grid">
                        <div class="info-card pub-incident-u3">
                            <strong>Location</strong>
                            <span id="incidentLocation">--</span>
                        </div>
                    </div>
                </section>

                <section class="panel-card">
                    <div class="eyebrow">Attachments</div>
                    <div class="attachment-grid" id="attachmentGrid">
                        <div class="empty-state">Loading attachments...</div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    
    <!-- (2026-07-13) Link consolidated public module; was inline script -->
    <script type="module" src="public.js"></script>
</body>
</html>
