<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Securo - Choose Your Role</title>
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <script src="../js/router.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <!-- (2026-07-13) Dramatic intro preloader styles and GSAP; was no preloader -->
    <link rel="stylesheet" href="../css/preloader.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../js/preloader.js"></script>
    
    <!-- (2026-07-13) Link consolidated public styles; was inline style tag -->
    <link rel="stylesheet" href="public.css">
</head>
<body class="page-role-selection" data-page="role-selection">

    <!-- (2026-07-13) Dramatic intro preloader with logo; was immediate page view -->
    <div id="securo-preloader-overlay">
        <div class="securo-preloader-bg"></div>
        <div class="securo-preloader-content">
            <div class="securo-preloader-logo-wrap">
                <img src="../assets/images/logo with text.png" alt="Securo" class="securo-preloader-logo">
                <div class="securo-preloader-shimmer"></div>
            </div>
            <!-- (2026-07-13) Move indicator below logo in preloader; was above logo -->
            <div class="securo-preloader-indicator">
                <span class="securo-preloader-status-text">INITIALIZING SECURE SYSTEMS</span>
                <div class="securo-preloader-progress-track">
                    <div class="securo-preloader-progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="selection-card">
        <div class="logo-area">
            <div class="logo-icon">
                <span class="material-symbols-outlined">shield_person</span>
            </div>
            <h1>Welcome to Securo</h1>
            <p class="subtitle">Please select your primary role to continue</p>
        </div>

        <div class="role-grid">
            <button class="role-btn student" onclick="selectRole('student')">
                <div class="icon-circle">
                    <span class="material-symbols-outlined">school</span>
                </div>
                <div class="role-info">
                    <h2>I am a Student</h2>
                    <p>Access campus map, SOS tools, and attendance.</p>
                </div>
                <span class="material-symbols-outlined arrow">arrow_forward_ios</span>
            </button>

            <button class="role-btn staff" onclick="selectRole('staff')">
                <div class="icon-circle">
                    <span class="material-symbols-outlined">badge</span>
                </div>
                <div class="role-info">
                    <h2>I am a Staff Member</h2>
                    <!-- (2026-07-13) Concise staff description; was verbose & uneven in height -->
                    <p>Access campus map, SOS tools, attendance, and support.</p>
                </div>
                <span class="material-symbols-outlined arrow">arrow_forward_ios</span>
            </button>

            <button class="role-btn guardian" onclick="selectRole('guardian')">
                <div class="icon-circle">
                    <span class="material-symbols-outlined">family_restroom</span>
                </div>
                <div class="role-info">
                    <h2>I am a Parent / Guardian</h2>
                    <p>Monitor ward's safety and receive alerts.</p>
                </div>
                <span class="material-symbols-outlined arrow">arrow_forward_ios</span>
            </button>
        </div>

        <div class="footer-note">
            <p>&copy; 2026 Securo Campus Safety Systems</p>
            <div class="pub-roleselection-u1">
                <!-- (2026-07-13) Remove app trailer link; was trailer link -->
                <a href="../public/about.html" class="pub-roleselection-u2">About Us</a>
                <span class="pub-roleselection-u3">•</span>
                <a href="../admin/admin.html?view=login" class="pub-roleselection-u4">Admin Terminal</a>
            </div>
        </div>
    </div>

    
    <!-- (2026-07-13) Link consolidated public module; was inline script -->
    <script type="module" src="public.js"></script>
</body>
</html>
