<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Securo - Choose Your Role</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.8);
            --ink: #0f172a;
            --muted: #64748b;
            --primary: #6366f1;
            --primary-soft: #eef2ff;
            --staff: #0f766e;
            --staff-soft: #ecfeff;
            --guardian: #f43f5e;
            --guardian-soft: #fff1f2;
            --shadow: 0 20px 50px rgba(0,0,0,0.05);
            --radius: 32px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(244, 63, 94, 0.05) 0%, transparent 40%),
                #f8fafc;
            font-family: "Outfit", sans-serif;
            color: var(--ink);
            padding: 24px;
        }

        .selection-card {
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            margin-bottom: 48px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: white;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            color: var(--primary);
        }

        .logo-icon span { font-size: 36px; }

        h1 {
            font-family: "Sora", sans-serif;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 48px;
        }

        .role-grid {
            display: grid;
            gap: 20px;
        }

        .role-btn {
            width: 100%;
            padding: 24px;
            background: white;
            border: 2px solid transparent;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 20px;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .role-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.08);
        }

        .role-btn.student {
            border-color: rgba(99, 102, 241, 0.1);
        }

        .role-btn.student:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .role-btn.guardian {
            border-color: rgba(244, 63, 94, 0.1);
        }

        .role-btn.guardian:hover {
            border-color: var(--guardian);
            background: var(--guardian-soft);
        }

        .role-btn.staff {
            border-color: rgba(15, 118, 110, 0.12);
        }

        .role-btn.staff:hover {
            border-color: var(--staff);
            background: var(--staff-soft);
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .student .icon-circle {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .guardian .icon-circle {
            background: var(--guardian-soft);
            color: var(--guardian);
        }

        .staff .icon-circle {
            background: var(--staff-soft);
            color: var(--staff);
        }

        .icon-circle span { font-size: 28px; }

        .role-info h2 {
            font-family: "Sora", sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 4px;
            letter-spacing: -0.02em;
        }

        .role-info p {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.4;
        }

        .arrow {
            margin-left: auto;
            color: var(--muted);
            opacity: 0.3;
            transition: all 0.3s;
        }

        .role-btn:hover .arrow {
            opacity: 1;
            transform: translateX(4px);
            color: inherit;
        }

        .footer-note {
            margin-top: 48px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            h1 { font-size: 1.75rem; }
            .subtitle { font-size: 1rem; }
            .role-btn { padding: 20px; }
            .icon-circle { width: 56px; height: 56px; }
        }
    </style>
</head>
<body>

    <div class="selection-card">
        <div class="logo-area">
            <div class="logo-icon">
                <span class="material-symbols-outlined">shield_person</span>
            </div>
            <h1>Welcome to Securo</h1>
            <p class="subtitle">Please select your primary role to continue</p>
        </div>

        <div class="role-grid">
            <button class="role-btn student" onclick="selectRole('student')">
                <div class="icon-circle">
                    <span class="material-symbols-outlined">school</span>
                </div>
                <div class="role-info">
                    <h2>I am a Student</h2>
                    <p>Access campus map, SOS tools, and attendance.</p>
                </div>
                <span class="material-symbols-outlined arrow">arrow_forward_ios</span>
            </button>

            <button class="role-btn staff" onclick="selectRole('staff')">
                <div class="icon-circle">
                    <span class="material-symbols-outlined">badge</span>
                </div>
                <div class="role-info">
                    <h2>I am a Staff Member</h2>
                    <p>Use the campus map, SOS tools, attendance, and support without guardian linking.</p>
                </div>
                <span class="material-symbols-outlined arrow">arrow_forward_ios</span>
            </button>

            <button class="role-btn guardian" onclick="selectRole('guardian')">
                <div class="icon-circle">
                    <span class="material-symbols-outlined">family_restroom</span>
                </div>
                <div class="role-info">
                    <h2>I am a Parent / Guardian</h2>
                    <p>Monitor ward's safety and receive alerts.</p>
                </div>
                <span class="material-symbols-outlined arrow">arrow_forward_ios</span>
            </button>
        </div>

        <div class="footer-note">
            <p>&copy; 2026 Securo Campus Safety Systems</p>
            <a href="admin-login.html" style="color: inherit; text-decoration: none; opacity: 0.5;">Admin Terminal</a>
        </div>
    </div>

    <script>
        function selectRole(role) {
            localStorage.setItem('securo_preferred_role', role);
            if (role === 'student' || role === 'staff') {
                window.location.href = 'login.html';
            } else {
                window.location.href = 'guardian.html';
            }
        }

        // Quick check: if already logged in, index.html will handle it.
        // But if someone manually comes here, we let them pick.
    </script>
</body>
</html>
